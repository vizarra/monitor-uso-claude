name: Release

# Al subir una etiqueta vX.Y.Z se generan los instaladores de las tres
# plataformas y se adjuntan a un borrador de release. El borrador se publica
# a mano después de probar el instalador en el SO principal.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Compila, empaqueta (msi/exe, dmg, deb/AppImage) y sube los archivos
      # al borrador de la release de esta etiqueta. Sin firma de código.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Monitor de uso de Claude ${{ github.ref_name }}
          releaseBody: |
            **¿Qué archivo descargo?**

            | Sistema | Archivo |
            | --- | --- |
            | Windows 10/11 | el que termina en `-setup.exe` |
            | macOS (Apple Silicon: M1, M2…) | el `.dmg` |
            | Linux (Debian/Ubuntu) | el `.deb` |
            | Linux (Fedora/openSUSE) | el `.rpm` |
            | Linux (otras distribuciones) | el `.AppImage` |

            Los instaladores no están firmados: la primera vez el sistema mostrará un aviso. Cómo continuar, en el [README](https://github.com/vizarra/monitor-uso-claude#instalación).

            Herramienta personal no oficial, sin relación con Anthropic.
          releaseDraft: true
          prerelease: false
          # Nombres sin versión para que los enlaces del README
          # (releases/latest/download/...) sirvan para todas las versiones.
          assetNamePattern: "monitor-uso-claude_[platform]_[arch][setup][ext]"
